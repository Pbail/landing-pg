<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting…</title>
<style>
  :root{
    --bg: #0f1115;
    --panel: #161922;
    --line: #262b38;
    --text: #eef0f5;
    --muted: #8a90a3;
    --accent: #5ee6a8;
  }

  *{ box-sizing: border-box; }

  html, body{
    height: 100%;
    margin: 0;
  }

  body{
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card{
    width: 100%;
    max-width: 420px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 40px 32px;
    text-align: center;
  }

  .ring{
    width: 64px;
    height: 64px;
    margin: 0 auto 24px;
    position: relative;
  }

  .ring svg{
    transform: rotate(-90deg);
    width: 64px;
    height: 64px;
  }

  .ring circle{
    fill: none;
    stroke-width: 4;
  }

  .ring .track{
    stroke: var(--line);
  }

  .ring .progress{
    stroke: var(--accent);
    stroke-linecap: round;
    transition: stroke-dashoffset 0.1s linear;
  }

  .ring .count{
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 600;
  }

  h1{
    font-size: 18px;
    font-weight: 600;
    margin: 0 0 8px;
  }

  p{
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 28px;
    line-height: 1.5;
    word-break: break-word;
  }

  .continue-btn{
    display: inline-block;
    width: 100%;
    padding: 13px 20px;
    background: var(--accent);
    color: #0f1115;
    font-size: 15px;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    text-decoration: none;
  }

  .continue-btn:active{
    transform: scale(0.98);
  }

  .fallback{
    margin-top: 16px;
    font-size: 12px;
  }

  .fallback a{
    color: var(--muted);
  }
</style>
</head>
<body>

  <div class="card">
    <div class="ring">
      <svg viewBox="0 0 64 64">
        <circle class="track" cx="32" cy="32" r="28"></circle>
        <circle class="progress" id="progressRing" cx="32" cy="32" r="28"></circle>
      </svg>
      <div class="count" id="countText">1</div>
    </div>

    <h1>Redirecting…</h1>
    <p id="destText">Aapko dusri site par bheja ja raha hai.</p>

    <a href="#" class="continue-btn" id="continueBtn">Continue now</a>

    <div class="fallback">
      Agar redirect nahi hota, <a href="#" id="fallbackLink">yahan click karo</a>.
    </div>
  </div>

<script src="config.js"></script>
<script>
  const url = SITE_CONFIG.redirectUrl;
  const totalMs = Math.max(0, SITE_CONFIG.delaySeconds) * 1000;

  document.getElementById("continueBtn").href = url;
  document.getElementById("fallbackLink").href = url;

  const radius = 28;
  const circumference = 2 * Math.PI * radius;
  const ring = document.getElementById("progressRing");
  ring.style.strokeDasharray = circumference;
  ring.style.strokeDashoffset = 0;

  const countText = document.getElementById("countText");
  const startTime = performance.now();
  let redirected = false;

  function goNow(){
    if (redirected) return;
    redirected = true;
    window.location.href = url;
  }

  function tick(now){
    const elapsed = now - startTime;
    const remaining = Math.max(0, totalMs - elapsed);
    const fraction = totalMs === 0 ? 0 : remaining / totalMs;

    ring.style.strokeDashoffset = circumference * (1 - fraction);
    countText.textContent = Math.ceil(remaining / 1000);

    if (elapsed >= totalMs){
      goNow();
      return;
    }
    requestAnimationFrame(tick);
  }

  requestAnimationFrame(tick);

  document.getElementById("continueBtn").addEventListener("click", function(e){
    e.preventDefault();
    goNow();
  });
</script>

</body>
</html>
