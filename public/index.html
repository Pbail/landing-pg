<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting...</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1e1b4b, #0f172a);
    color: #f1f5f9;
  }
  .card {
    text-align: center;
    background: rgba(255,255,255,0.05);
    padding: 40px 32px;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    max-width: 380px;
    width: 90%;
  }
  .spinner {
    width: 56px;
    height: 56px;
    border: 4px solid rgba(255,255,255,0.15);
    border-top-color: #6366f1;
    border-radius: 50%;
    margin: 0 auto 20px;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
  p { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
  .timer { color: #818cf8; font-weight: 700; }
  button {
    background: #6366f1;
    color: white;
    border: none;
    padding: 12px 28px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { background: #4f46e5; }
</style>
</head>
<body>

<div class="card">
  <div class="spinner"></div>
  <h1>Aap redirect ho rahe hain</h1>
  <p><span class="timer" id="timer">3</span> second mein aap agli site par pahunch jayenge</p>
  <button id="continueBtn">Continue &rarr;</button>
</div>

<script>
  let targetUrl = "https://example.com";
  let secondsLeft = 3;
  let redirected = false;
  let countdownInterval;

  const timerEl = document.getElementById('timer');
  const continueBtn = document.getElementById('continueBtn');

  function doRedirect() {
    if (redirected) return;
    redirected = true;
    window.location.href = targetUrl;
  }

  continueBtn.addEventListener('click', doRedirect);

  // Fetch live config (url + delay) from server, controlled by Telegram bot
  fetch('/api/config')
    .then(res => res.json())
    .then(config => {
      targetUrl = config.url || targetUrl;
      secondsLeft = typeof config.delay === 'number' ? config.delay : secondsLeft;

      if (config.enabled === false) {
        // Auto-redirect disabled from bot side, only manual continue works
        timerEl.parentElement.textContent = '';
        return;
      }

      timerEl.textContent = secondsLeft;

      if (secondsLeft <= 0) {
        doRedirect();
        return;
      }

      countdownInterval = setInterval(() => {
        secondsLeft -= 1;
        timerEl.textContent = secondsLeft;
        if (secondsLeft <= 0) {
          clearInterval(countdownInterval);
          doRedirect();
        }
      }, 1000);
    })
    .catch(() => {
      // Fallback: agar config load na ho to default 3 sec baad redirect
      countdownInterval = setInterval(() => {
        secondsLeft -= 1;
        timerEl.textContent = secondsLeft;
        if (secondsLeft <= 0) {
          clearInterval(countdownInterval);
          doRedirect();
        }
      }, 1000);
    });
</script>

</body>
</html>
